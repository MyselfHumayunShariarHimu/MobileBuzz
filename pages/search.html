<section class="container">
  <form id="searchForm" role="search" class="search-box">
    <input type="search" id="searchInput" data-i18n-attr="placeholder:common.search_placeholder" placeholder="আপনার মোবাইলে কী সমস্যা হচ্ছে?">
    <button class="btn btn-primary" type="submit" data-i18n="common.nav_search">সার্চ</button>
  </form>

  <div id="recentSearchChips" class="demo-row demo-row--tight"></div>

  <div class="tabs" id="searchTabs" role="tablist">
    <button class="tab is-active" data-tab="all" role="tab" data-i18n="repair.tab_all">সব</button>
    <button class="tab" data-tab="knowledgeBase" role="tab" data-i18n="repair.tab_repair">Repair</button>
    <button class="tab" data-tab="devices" role="tab" data-i18n="common.menu_devices">Devices</button>
    <button class="tab" data-tab="components" role="tab" data-i18n="common.menu_components">Components</button>
    <button class="tab" data-tab="tools" role="tab" data-i18n="common.menu_tools">Tools</button>
    <button class="tab" data-tab="lessons" role="tab" data-i18n="common.nav_learn">Learn</button>
    <button class="tab" data-tab="errorCodes" role="tab" data-i18n="repair.tab_error_codes">Error Codes</button>
    <button class="tab" data-tab="videos" role="tab" data-i18n="common.menu_videos">Videos</button>
    <button class="tab" data-tab="web" role="tab" data-i18n="common.menu_web_search">Web</button>
  </div>

  <div id="searchResults"></div>
</section>
